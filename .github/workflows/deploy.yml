# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: AppJson
        run: |
          cd public/externals/espruino/BangleApps
          # Build against the pinned submodule commit so what ships is what
          # was reviewed/tested. Bump the pin deliberately (see README).
          echo "Building against pinned BangleApps commit:"
          git rev-parse HEAD
          echo ""
          cp $(which node) ./bin/nodejs
          export PATH="$PATH:$PWD/bin"
          ./bin/create_apps_json.sh apps.json
          # pre-publish.sh runs bin/sanitycheck.js, which does
          # require("acorn") and resolves it up into this repo's
          # node_modules. Keep "acorn" in devDependencies or this step fails
          # with "Error: no acorn" (it used to arrive via eslint).
          ./bin/pre-publish.sh
        shell: bash
      - name: Build
        run: yarn build
        env:
          BASE_URL: /banglejs-home
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload dist repository
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
