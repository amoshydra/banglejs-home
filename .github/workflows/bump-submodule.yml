name: Bump BangleApps submodule

on:
  # Weekly, Monday 06:00 UTC
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: 'bump-bangleapps'
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Update submodule to upstream master
        id: update
        run: |
          cd public/externals/espruino/BangleApps
          git fetch origin master
          git checkout --detach origin/master
          git submodule update --init --recursive
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          cd -
          git add public/externals/espruino/BangleApps
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.update.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/bump-bangleapps"
          git checkout -B "$branch"
          git commit -m "chore: bump BangleApps submodule to $SHA"
          git push -f origin "$branch"
          gh pr view "$branch" >/dev/null 2>&1 || \
            gh pr create --base main --head "$branch" \
              --title "chore: bump BangleApps submodule to $SHA" \
              --body "Automated bump of the vendored BangleApps submodule to espruino/BangleApps@$SHA. CI runs the submodule integration contract test plus lint/test/build. Please device-test (connect, install, activate, remove) before merging."
          echo "PR ready: $branch"
