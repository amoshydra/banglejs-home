name: Sync BangleApps submodule

on:
  # Weekly, Monday 06:00 UTC
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'sync-bangleapps'
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          submodules: recursive
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Update submodule to upstream master
        id: update
        run: |
          cd public/externals/espruino/BangleApps
          git fetch origin master
          git checkout --detach origin/master
          git submodule update --init --recursive
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          cd -
          git add public/externals/espruino/BangleApps
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Gate: only keep the bump if the app still builds against the new
      # submodule and the integration contract test still passes.
      - name: Contract test
        if: steps.update.outputs.changed == 'true'
        run: yarn test --run
      - name: Lint
        if: steps.update.outputs.changed == 'true'
        run: yarn lint
      - name: Build
        if: steps.update.outputs.changed == 'true'
        run: yarn build
      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        env:
          SHA: ${{ steps.update.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync BangleApps submodule to $SHA"
          git push origin main
      - name: No update
        if: steps.update.outputs.changed != 'true'
        run: echo "Submodule already at upstream master; nothing to do."
