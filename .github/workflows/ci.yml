name: CI

on:
  pull_request:
  push:
    branches: ['main']

# Only needs to read the repo
permissions:
  contents: read

# Cancel superseded runs on the same ref
concurrency:
  group: 'ci-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test --run
      - name: Build
        run: yarn build
