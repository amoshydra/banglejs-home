<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BangleJS Home</title>
  </head>
  <style>
    :root {
      font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      font-weight: 400;

      /* Dark-only app: without this the UA paints <button>/<dialog> with
         "buttontext"/"canvastext", which is black under a light OS
         preference - black text on our dark surfaces. */
      color-scheme: dark;

      /* Palette tokens (kept in one place so contrast stays consistent). */
      --accent: #4a52e0;        /* accent behind white text - 5.8:1 */
      --accent-text: #aab0ff;   /* accent used as text/icon colour - 7.7:1 on #242424 */
      --text-muted: rgba(255, 255, 255, 0.7); /* 7.6:1 on #2b2b2b */

      color: rgba(255, 255, 255, 0.87);
      background-color: #242424;

      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .inital-loader {
      padding: 2rem;
      text-align: center;
    }
  </style>
  <body>
    <script>
      if (new URLSearchParams(location.search).get("debug") === "true") {
        const errorOverlay = document.createElement("div");
        errorOverlay.style="position: fixed; top: 0; left: 0; width: 100%; z-index: 100; background: rgba(0, 0, 0, 0.5);";
        document.body.appendChild(errorOverlay);
  
        window.onerror = function myErrorHandler(message, url, lineNumber) {
          const child = document.createElement("pre");
          child.textContent = [
            `message: ${message}`,
            `url: ${url}`,
            `lineNumber: ${lineNumber}`
          ].join('\n');
          child.style = "padding: 0.5rem;";
          child.addEventListener("dblclick", () => {
            child.remove();
          })
          errorOverlay.appendChild((child));
        }
      }
    </script>
    <div id="root">
      <div class="inital-loader">
        <header>
          🖥️ 📱 ⌚
        </header>
        <br />
        Loading application...
      </div>
    </div>
    <script>
      const SETTINGS = {
        pretokenise : true,
        minify : false,  // disabled by default due to https://github.com/espruino/BangleApps/pull/355#issuecomment-620124162
        settime : false, // Always update time when we connect
        favourites : ["launch"],
        language : "",
        appsfavouritedThisSession : [],
        bleCompat: false, // 20 byte MTU BLE Compatibility mode
        sendUsageStats: true,  // send usage stats to banglejs.com
        alwaysAllowUpdate : false, //  Always show "reinstall app" button regardless of the version
        alwaysAllowEmulator : false, //  Always show "emulator" button regardless of whether it's supported by the app
        autoReload: false, //  Automatically reload watch after app App Loader actions (removes "Hold button" prompt)
        noPackets: false  // Enable File Upload Compatibility mode (disables binary packet upload)
      };
    </script>
    <script src="/externals/espruino/BangleApps/core/js/utils.js"></script>
    <script src="/externals/espruino/BangleApps/webtools/puck.js"></script>
    <script src="/externals/espruino/BangleApps/webtools/heatshrink.js"></script>
    <script src="/externals/espruino/BangleApps/core/lib/espruinotools.js"></script>
    <script src="/externals/espruino/BangleApps/core/js/comms.js"></script>
    <script src="/externals/espruino/BangleApps/core/js/appinfo.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
